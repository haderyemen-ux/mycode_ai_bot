services:
  - type: web
    name: mycode-ai-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && pip check && python -m py_compile bot.py
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 bot:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: TELEGRAM_BOT_TOKEN_B64
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: GEMINI_MODELS
        value: gemini-2.5-flash,gemini-3.7-flash,gemini-3.8-flash
      - key: MAX_HISTORY
        value: "12"
      - key: MAX_OUTPUT_TOKENS
        value: "4096"
      - key: TEMPERATURE
        value: "0.25"
