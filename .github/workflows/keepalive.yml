name: Keep My Code Bot Warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        env:
          BOT_HEALTH_URL: ${{ secrets.BOT_HEALTH_URL }}
        run: |
          set -euo pipefail
          test -n "$BOT_HEALTH_URL"
          curl --fail --silent --show-error --max-time 20 "$BOT_HEALTH_URL/health"
